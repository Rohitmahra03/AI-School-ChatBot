<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>School AI — AI Study Assistant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #243bff33, transparent 35%),
        radial-gradient(circle at bottom right, #00d4ff22, transparent 35%),
        #070b17;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      overflow: hidden;

      background: rgba(15, 22, 42, 0.82);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    /* HEADER */

    header {
      padding: 22px 25px;
      border-bottom: 1px solid rgba(255,255,255,.09);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(135deg, #6675ff, #00c6ff);
      font-size: 24px;
      box-shadow: 0 8px 25px rgba(0,180,255,.25);
    }

    .brand h1 {
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .brand p {
      margin-top: 3px;
      color: #9ba6bd;
      font-size: 12px;
    }

    .clear-btn {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: #dce4f7;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s;
    }

    .clear-btn:hover {
      background: rgba(255,255,255,.1);
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 650px;
      margin: 70px auto;
      text-align: center;
    }

    .welcome-icon {
      width: 75px;
      height: 75px;
      margin: auto auto 20px;
      border-radius: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(135deg, #6574ff, #00c6ff);
      font-size: 35px;
      box-shadow: 0 15px 40px rgba(0,180,255,.22);
    }

    .welcome h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9ba6bd;
      line-height: 1.6;
      font-size: 15px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
    }

    .suggestion {
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.1);
      color: #dce4f7;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      transition: .2s;
    }

    .suggestion:hover {
      background: rgba(100,120,255,.15);
      border-color: rgba(100,120,255,.35);
    }

    /* MESSAGES */

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      animation: appear .25s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6474ff, #00bfff);
    }

    .message.user .avatar {
      order: 2;
      background: #29334f;
    }

    .bubble {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
      color: #e9eefc;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #4f5fff, #4965df);
      border: none;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message.ai .bubble {
      border-bottom-left-radius: 5px;
    }

    /* INPUT */

    .input-area {
      padding: 18px 20px 20px;
      border-top: 1px solid rgba(255,255,255,.08);
      background: rgba(5,8,18,.25);
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;

      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 7px;
      transition: .2s;
    }

    .input-box:focus-within {
      border-color: rgba(100,130,255,.6);
      box-shadow: 0 0 0 3px rgba(100,130,255,.08);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 11px 10px;
      min-height: 45px;
      max-height: 130px;
    }

    textarea::placeholder {
      color: #7e899f;
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 13px;
      cursor: pointer;

      color: white;
      font-size: 19px;

      background: linear-gradient(135deg, #6474ff, #00bfff);
      transition: .2s;
    }

    .send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(0,190,255,.2);
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .note {
      text-align: center;
      color: #68748c;
      font-size: 11px;
      margin-top: 9px;
    }

    /* LOADING */

    .typing {
      display: flex;
      gap: 5px;
      padding: 8px 3px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8c99b5;
      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: .45;
      }
      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* MOBILE */

    @media(max-width: 650px) {
      body {
        padding: 0;
      }

      .app {
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
        border: none;
      }

      header {
        padding: 17px;
      }

      .brand h1 {
        font-size: 18px;
      }

      .brand p {
        font-size: 11px;
      }

      .logo {
        width: 42px;
        height: 42px;
      }

      .chat {
        padding: 18px;
      }

      .welcome {
        margin: 45px auto;
      }

      .welcome h2 {
        font-size: 26px;
      }

      .bubble {
        max-width: 86%;
      }

      .input-area {
        padding: 12px;
      }

      .clear-btn {
        font-size: 12px;
        padding: 8px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header>
      <div class="brand">

        <div class="logo">
          🎓
        </div>

        <div>
          <h1>School AI</h1>
          <p>Your intelligent study assistant</p>
        </div>
      </div>

      <button class="clear-btn" onclick="clearChat()">
        Clear
      </button>
    </header>


    <!-- CHAT -->

    <main class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="welcome-icon">
          🤖
        </div>

        <h2>How can I help you?</h2>

        <p>
          Ask me anything about your school studies,
          homework, science, mathematics, history, GK
          or any other subject.
        </p>

        <div class="suggestions">

          <button class="suggestion"
            onclick="askSuggestion('Explain Newton’s laws of motion in simple Hindi')">
            ⚡ Newton's Laws
          </button>

          <button class="suggestion"
            onclick="askSuggestion('What is photosynthesis? Explain simply.')">
            🌱 Photosynthesis
          </button>

          <button class="suggestion"
            onclick="askSuggestion('भारत का संविधान कब लागू हुआ?')">
            🇮🇳 India GK
          </button>

          <button class="suggestion"
            onclick="askSuggestion('Solve 2x + 5 = 15 step by step')">
            🧮 Mathematics
          </button>

        </div>

      </div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="question"
          placeholder="Ask your school question..."
          rows="1"
          onkeydown="handleKey(event)"
        ></textarea>

        <button
          class="send-btn"
          id="sendBtn"
          onclick="sendQuestion()"
          title="Send">
          ➤
        </button>

      </div>

      <div class="note">
        School AI can make mistakes. Always verify important information.
      </div>

    </div>

  </div>


<script>

  /*
   =====================================================
   GROQ API CONFIGURATION
   =====================================================

   DEMO ONLY:
   Never expose your API key on a public website.

   Replace the value below with your Groq API key.
  */

  const GROQ_API_KEY = "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";


  /*
   =====================================================
   API SETTINGS
   =====================================================
  */

  const API_URL =
    "https://api.groq.com/openai/v1/chat/completions";


  /*
   IMPORTANT:
   Keep the model configurable.
   If Groq changes model availability, update only this line.
  */

  const MODEL = "openai/gpt-oss-120b";


  /*
   Conversation memory
  */

  let messages = [
    {
      role: "system",
      content:
        `You are School AI, a friendly educational assistant.

Your job is to help school students understand their questions.

Rules:
1. Answer clearly and accurately.
2. Support Hindi, English and Hinglish.
3. If the student asks in Hindi, answer in Hindi.
4. If the student asks in Hinglish, answer in Hinglish.
5. Explain difficult concepts in simple language.
6. For mathematics and science, show steps when useful.
7. Do not unnecessarily make answers very long.
8. For school homework, help the student understand the concept.
9. Use examples when they make the explanation easier.
10. Be polite, encouraging and student-friendly.`
    }
  ];


  /*
   =====================================================
   SEND QUESTION
   =====================================================
  */

  async function sendQuestion() {

    const input =
      document.getElementById("question");

    const question =
      input.value.trim();

    if (!question) return;


    // Check API key

    if (
      !GROQ_API_KEY ||
      GROQ_API_KEY === "YOUR_GROQ_API_KEY"
    ) {

      addMessage(
        "ai",
        "⚠️ Please add your Groq API key inside the code first."
      );

      return;
    }


    // Remove welcome screen

    const welcome =
      document.getElementById("welcome");

    if (welcome) {
      welcome.remove();
    }


    // Show user message

    addMessage("user", question);

    input.value = "";
    input.style.height = "auto";


    // Disable send button

    const sendBtn =
      document.getElementById("sendBtn");

    sendBtn.disabled = true;


    // Add question to conversation

    messages.push({
      role: "user",
      content: question
    });


    // Show typing

    const loadingId =
      showTyping();


    try {

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json",

            "Authorization":
              `Bearer ${GROQ_API_KEY}`
          },

          body: JSON.stringify({

            model: MODEL,

            messages: messages,

            temperature: 0.4,

            max_tokens: 1200

          })

        });


      const data =
        await response.json();


      removeTyping(loadingId);


      if (!response.ok) {

        let errorMessage =
          data?.error?.message ||
          "Something went wrong.";

        addMessage(
          "ai",
          "❌ Error: " + errorMessage
        );

        // Remove failed user message
        messages.pop();

        return;
      }


      const answer =
        data?.choices?.[0]?.message?.content;


      if (!answer) {

        addMessage(
          "ai",
          "Sorry, I couldn't generate an answer."
        );

        return;
      }


      // Save AI response

      messages.push({
        role: "assistant",
        content: answer
      });


      // Display answer

      addMessage("ai", answer);


    } catch (error) {

      removeTyping(loadingId);

      addMessage(
        "ai",
        "❌ Network error. Please check your internet connection and try again."
      );

      messages.pop();

    } finally {

      sendBtn.disabled = false;

      input.focus();

    }

  }


  /*
   =====================================================
   ADD MESSAGE
   =====================================================
  */

  function addMessage(type, text) {

    const chat =
      document.getElementById("chat");


    const wrapper =
      document.createElement("div");

    wrapper.className =
      `message ${type}`;


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";

    avatar.textContent =
      type === "user" ? "👤" : "🤖";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      text;


    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);


    chat.scrollTop =
      chat.scrollHeight;

  }


  /*
   =====================================================
   TYPING INDICATOR
   =====================================================
  */

  function showTyping() {

    const chat =
      document.getElementById("chat");


    const id =
      "typing-" + Date.now();


    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message ai";

    wrapper.id = id;


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";

    avatar.textContent =
      "🤖";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    bubble.innerHTML = `
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    `;


    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);


    chat.scrollTop =
      chat.scrollHeight;


    return id;

  }


  /*
   =====================================================
   REMOVE TYPING
   =====================================================
  */

  function removeTyping(id) {

    const element =
      document.getElementById(id);

    if (element) {
      element.remove();
    }

  }


  /*
   =====================================================
   SUGGESTION BUTTON
   =====================================================
  */

  function askSuggestion(text) {

    const input =
      document.getElementById("question");

    input.value = text;

    sendQuestion();

  }


  /*
   =====================================================
   ENTER KEY
   =====================================================
  */

  function handleKey(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendQuestion();

    }

  }


  /*
   =====================================================
   CLEAR CHAT
   =====================================================
  */

  function clearChat() {

    const chat =
      document.getElementById("chat");


    chat.innerHTML = `
      <div class="welcome" id="welcome">

        <div class="welcome-icon">
          🤖
        </div>

        <h2>How can I help you?</h2>

        <p>
          Ask me anything about your school studies,
          homework, science, mathematics, history, GK
          or any other subject.
        </p>

        <div class="suggestions">

          <button class="suggestion"
            onclick="askSuggestion('Explain Newton’s laws of motion in simple Hindi')">
            ⚡ Newton's Laws
          </button>

          <button class="suggestion"
            onclick="askSuggestion('What is photosynthesis? Explain simply.')">
            🌱 Photosynthesis
          </button>

          <button class="suggestion"
            onclick="askSuggestion('भारत का संविधान कब लागू हुआ?')">
            🇮🇳 India GK
          </button>

          <button class="suggestion"
            onclick="askSuggestion('Solve 2x + 5 = 15 step by step')">
            🧮 Mathematics
          </button>

        </div>

      </div>
    `;


    messages = [
      {
        role: "system",
        content:
          `You are School AI, a friendly educational assistant.

Help school students with Maths, Science,
History, Geography, GK and other school subjects.

Answer in the language used by the student.
Explain concepts simply and step-by-step when useful.
Be accurate, friendly and concise.`
      }
    ];

  }


  /*
   =====================================================
   AUTO RESIZE TEXTAREA
   =====================================================
  */

  document
    .getElementById("question")
    .addEventListener("input", function () {

      this.style.height = "auto";

      this.style.height =
        Math.min(this.scrollHeight, 130) + "px";

    });

</script>

</body>
</html>
